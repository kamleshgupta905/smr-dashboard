name: Deploy SMR to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Backend Engine is in Public Distribution
        run: |
          mkdir -p client/public/api
          cp api/index.php client/public/api/index.php || true

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: Build Production Bundle
        working-directory: ./client
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'domains/vmhgroupsmr.com/public_html/smr_v2/' }}
          local-dir: ./client/dist/
          dangerous-clean-slate: false
