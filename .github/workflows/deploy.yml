name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to api.vmhgroupsmr.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: ⚡ Build Vite Production Bundle
        run: |
          cd client
          npm run build

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python MySQL Driver
        run: pip install pymysql cryptography

      - name: 🚀 Deploy to Hostinger apitool Root
        env:
          DB_HOST: ${{ secrets.HOSTINGER_DB_HOST || 'srv2215.hstgr.io' }}
          DB_USER: ${{ secrets.HOSTINGER_DB_USER || 'u839355029_vmhgropu' }}
          DB_PASS: ${{ secrets.HOSTINGER_DB_PASS || 'U839355029_vmhgroup' }}
          DB_NAME: ${{ secrets.HOSTINGER_DB_NAME || 'u839355029_vmh_group' }}
        run: python scripts/deploy_to_apitool_root.py
