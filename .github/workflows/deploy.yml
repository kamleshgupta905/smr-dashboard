name: Deploy React App to Hostinger via FTP

on:
  push:
    branches:
      - main
      - master # Triggers deployment when you push to main or master branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Ensure it matches your Vite requirements

      - name: Install Dependencies
        working-directory: ./client
        run: npm install

      - name: Build the React App
        working-directory: ./client
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./client/dist/
          server-dir: ./public_html/smr/ # Adjust if your Hostinger folder is different
