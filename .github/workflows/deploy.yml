name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to api.vmhgroupsmr.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧪 Lint PHP (syntax must pass before any deploy)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🧪 Check PHP syntax
        run: php -l api/index.php && php -l config/zamplia.php && php -l config/cors.php

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: ⚡ Build Vite Production Bundle
        run: |
          cd client
          npm run build

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python MySQL Driver
        run: pip install pymysql cryptography

      - name: 🚀 Deploy to Hostinger apitool Root
        env:
          DB_HOST: ${{ secrets.HOSTINGER_DB_HOST }}
          DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          DB_PASS: ${{ secrets.HOSTINGER_DB_PASS }}
          DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
        run: python scripts/deploy_to_apitool_root.py
